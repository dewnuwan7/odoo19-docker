[options]
; Database configuration
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_name = 
dbfilter = .*
admin_passwd = 2026
list_db = True

;nginx-proxy
proxy_mode = True


; Addons path
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

; Server modules
#server_wide_modules = web,open_redis_ormcache_19

; HTTP configuration
http_interface = 0.0.0.0
http_port = 8069

; Longpolling configuration
longpolling_port = 8072

; Worker configuration for multi-threading
workers = 2
worker_class = gevent
max_cron_threads = 2
timeout = 120
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192

; Redis ORM Cache Configuration (Required for module)
#ormcache_redis_url = redis://redis:6379/0
#ormcache_redis_expire = 604800

; Optional: Session store in Redis (uncomment if needed)
; session_store = redis
; session_store_url = redis://redis:6379/1

; Logging configuration
log_level = info
logfile = False

; Security
secure_cookies = False

; Database connection pooling
db_sslmode = prefer
